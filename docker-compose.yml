# =============================================================================
# WaterPulse Canada — Docker Compose (Development)
# =============================================================================
#
# Orchestrates 4 services: PostgreSQL, FastAPI backend, Next.js frontend,
# and a Caddy reverse proxy that unifies them under a single origin.
#
# Quick start:
#   1. Copy .env.example to .env and fill in secrets
#   2. docker-compose up --build
#   3. Open http://localhost (Caddy) or http://localhost:3000 (frontend direct)
#
# Environment variables:
#   Docker Compose automatically loads ".env" from the project root and uses
#   it to resolve ${VARIABLE} references in this YAML file. The .env file
#   must exist before running docker-compose up.
#
# Architecture:
#   Browser → :80 (caddy) → /api/* → backend:8000 → db:5432
#                          → /*    → frontend:3000
#
# The Caddy proxy solves the cross-origin cookie problem: in production,
# both frontend and backend are served from a single origin, so HTTPOnly
# cookies set by the backend are automatically sent by the browser.
#
# Data persistence:
#   - PostgreSQL data is stored in the "pgdata" named volume
#   - Survives docker-compose down, only deleted with docker-compose down -v
#
# Development features:
#   - Backend source code is bind-mounted for live reloading (--reload flag)
#   - Frontend is built as a standalone production image (rebuild to see changes)
#   - Database port 5432 is exposed for local tools (pgAdmin, psql, etc.)
#
# Useful commands:
#   docker-compose up --build          # Start all services (rebuild images)
#   docker-compose up -d --build       # Start in background
#   docker-compose logs -f backend     # Follow backend logs
#   docker-compose exec backend alembic upgrade head   # Run migrations manually
#   docker-compose exec db psql -U waterpulse -d waterpulse  # Open psql shell
#   docker-compose down                # Stop all (keeps database data)
#   docker-compose down -v             # Stop all AND delete database data
# =============================================================================

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  # Official PostgreSQL 19 on Alpine Linux (lightweight).
  # Credentials are set via environment variables — POSTGRES_PASSWORD comes
  # from the .env file (interpolated by Docker Compose at runtime).
  # The healthcheck ensures the backend waits until PostgreSQL is truly ready
  # to accept queries, not just TCP connections.
  db:
    image: postgres:19.0-alpine
    env_file:
      - .env     # Loads POSTGRES_PASSWORD for database initialisation
    environment:
      POSTGRES_USER: waterpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # From .env
      POSTGRES_DB: waterpulse
    ports:
      # Loopback-only so the database is never reachable from the LAN.
      # POSTGRES_HOST_PORT lets you move it off 5432 when a local Postgres
      # install already holds that port (set it in .env).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data in a version-specific subdirectory
      # (PGDATA=/var/lib/postgresql/19/docker) and expect the volume at the
      # parent /var/lib/postgresql — mounting the old .../data path makes the
      # container refuse to start. A major-version upgrade is a dump/restore
      # into a fresh volume (see waterpulse-backend/README.md, "Upgrading
      # PostgreSQL"); the previous PG16 volume "pgdata" is kept untouched
      # for rollback until you delete it yourself.
      - pgdata19:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  # Python 3.15 running the FastAPI application server (uvicorn).
  #
  # Startup sequence (handled by entrypoint.sh):
  #   1. Wait for PostgreSQL to accept queries (psycopg2 retry loop using
  #      POSTGRES_PASSWORD env var — not DATABASE_URL_SYNC, which has the
  #      SQLAlchemy dialect prefix that raw psycopg2 cannot parse)
  #   2. Run Alembic migrations (alembic upgrade head)
  #   3. Start uvicorn on port 8000
  #
  # Environment variables:
  #   - env_file loads secrets from .env (SECRET_KEY, API URLs, etc.)
  #   - DATABASE_URL / DATABASE_URL_SYNC are constructed here using the Docker
  #     service name "db" as the hostname (only works inside the Docker network)
  #   - FRONTEND_URL controls CORS allowed origins
  #
  # Development bind mounts:
  #   - app/ and alembic/ are mounted from the host so code changes are
  #     immediately visible inside the container. Combined with --reload,
  #     uvicorn restarts automatically when you save a file.
  backend:
    build:
      context: ./waterpulse-backend
      dockerfile: Dockerfile
    ports:
      # Loopback-only direct access for local tooling; browsers go through
      # Caddy at /api. BACKEND_HOST_PORT moves it off 8000 when needed.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env     # Loads SECRET_KEY, API URLs, POSTGRES_PASSWORD, etc.
    environment:
      # Database connection strings use the Docker service name "db" as host.
      # These override any DATABASE_URL in .env, ensuring the backend
      # connects to the containerised PostgreSQL, not a local install.
      DATABASE_URL: postgresql+asyncpg://waterpulse:${POSTGRES_PASSWORD}@db:5432/waterpulse
      DATABASE_URL_SYNC: postgresql+psycopg2://waterpulse:${POSTGRES_PASSWORD}@db:5432/waterpulse
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: ${COOKIE_SECURE:-False}
    depends_on:
      db:
        condition: service_healthy    # Wait for pg_isready, not just container start
    volumes:
      # Bind mounts for development hot-reloading.
      # Changes to Python files on the host are reflected inside the container.
      - ./waterpulse-backend/app:/app/app
      - ./waterpulse-backend/alembic:/app/alembic
      # Data-source verification test suite (DS-STD-2026.1). A sibling of app/
      # is otherwise invisible in the container (Dockerfile copies only app/ +
      # alembic/, and .dockerignore strips test_*.py); this bind mount makes it
      # runnable via `docker-compose run -w /app backend python -m tests.<mod>`
      # and surfaces tests/logs/ outputs on the host.
      - ./waterpulse-backend/tests:/app/tests
    # The --reload flag is passed as extra args to uvicorn via entrypoint.sh.
    # Remove this in production (use docker-compose.prod.yml override).
    command: ["--reload"]
    healthcheck:
      # python:*-slim ships no curl (the old curl check always failed), so
      # probe with the interpreter that is guaranteed to be present.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s    # Allow time for Alembic migrations before checking

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  # Multi-stage Docker build that produces a standalone Next.js server.
  #
  # NEXT_PUBLIC_API_URL is a build argument because Next.js bakes NEXT_PUBLIC_*
  # variables into the JavaScript bundle at build time — they cannot be changed
  # at runtime. For production behind Caddy, set this to your domain
  # (e.g., "https://waterpulse.ca") at build time on the VPS.
  #
  # The standalone output mode (configured in next.config.mjs) produces a
  # self-contained server.js with only the necessary node_modules, reducing
  # the production image from ~500 MB to ~100 MB.
  frontend:
    build:
      context: ./waterpulse-frontend
      dockerfile: Dockerfile
      args:
        # This URL gets embedded into the client-side JavaScript at build time.
        # Empty string = same-origin relative requests, so the app works from
        # localhost, a LAN IP, or a production domain without a rebuild.
        # Requires Caddy to front both /api/* and /* (which it does).
        NEXT_PUBLIC_API_URL: ""
        # URL of the self-hosted PMTiles basemap served by Caddy. Leave blank
        # to fall back to CartoDB Voyager (e.g. on a fresh clone without the
        # ~5–6 GB canada.pmtiles file downloaded yet). See tiles/README.md.
        NEXT_PUBLIC_TILES_URL: ${NEXT_PUBLIC_TILES_URL:-}
    ports:
      - "3000:3000"     # Direct access; also proxied via Caddy at /
    depends_on:
      - backend
    healthcheck:
      # Alpine images don't have curl, so use wget instead. Use 127.0.0.1,
      # not "localhost": in this image localhost resolves to ::1 (IPv6)
      # first, while Next.js listens on 0.0.0.0 (IPv4) — the old check was
      # refused and the container always reported "unhealthy".
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Caddy Reverse Proxy ─────────────────────────────────────────────────────
  # Single-origin entry point. Routes:
  #   /api/*, /docs, /openapi.json → backend:8000
  #   /*                           → frontend:3000 (Next.js)
  #
  # Essential for HTTPOnly cookie auth — same-origin means cookies set by
  # the backend are automatically sent on subsequent requests.
  #
  # SITE_ADDRESS controls dev vs prod TLS:
  #   Dev:  :80            plain HTTP on localhost
  #   Prod: waterpulse.ca  Caddy auto-provisions TLS via Let's Encrypt (ACME)
  #
  # The Caddyfile is bind-mounted read-only so edits take effect with a
  # container restart (no rebuild). caddy-data holds ACME certs across
  # restarts — wiping it in production forces re-issuance (LE rate-limited).
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tiles:/srv/tiles:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

# ── Named Volumes ─────────────────────────────────────────────────────────────
# pgdata19:     Persists PostgreSQL 19 data files across container restarts.
# pgdata:       Legacy PostgreSQL 16 volume — no longer mounted; kept only as a
#               rollback point after the 16 -> 19 upgrade. Remove with
#               `docker volume rm waterpulse-canada_pgdata` once satisfied.
# caddy-data:   Persists ACME certs and keys across restarts.
# caddy-config: Persists Caddy runtime config.
# WARNING: docker-compose down -v will DELETE all volumes (DB data + TLS certs).
volumes:
  pgdata19:
  pgdata:
  caddy-data:
  caddy-config:
